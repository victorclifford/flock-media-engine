# Flock Media Engine: build on each platform, test against a full official FFmpeg there, and
# (for a version tag like v1.0.0) publish a release with checksums.
#
# Safety: no secrets are used anywhere. Only GitHub's own actions, pinned to exact commits.
# Every job can only read the repository, except the release job, which runs only for tags
# pushed by the owner. Workflows from outside contributors wait for approval (repo setting).
name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MEDIAMTX: v1.21.1 # stands in for YouTube / Facebook in the tests

jobs:
  macos:
    name: macOS (${{ matrix.target }})
    # Each build on its own kind of Mac, so its tests (speed included) run natively against a
    # native reference FFmpeg. (Under Rosetta the Intel build would look twice as slow.)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14 # Apple silicon
          - target: macos-x64
            runner: macos-15-intel # GitHub's Intel Mac image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: scripts/build.sh ${{ matrix.target }}
      - name: Reference FFmpeg and test server
        run: |
          brew install ffmpeg
          ARCH=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
          curl -sSfL "https://github.com/bluenviron/mediamtx/releases/download/$MEDIAMTX/mediamtx_${MEDIAMTX}_darwin_${ARCH}.tar.gz" | tar xz mediamtx
      - name: Compare with official FFmpeg
        run: tests/compare.sh dist/${{ matrix.target }}/flock-media "$(command -v ffmpeg)" ./mediamtx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  windows-build:
    name: Windows (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64
          scripts/build.sh windows-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: dist/windows-x64/

  windows-test:
    name: Windows (test)
    needs: windows-build
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist/windows-x64
      - name: Reference FFmpeg and test server
        run: |
          choco install ffmpeg -y --no-progress
          curl -sSfL "https://github.com/bluenviron/mediamtx/releases/download/$MEDIAMTX/mediamtx_${MEDIAMTX}_windows_amd64.zip" -o mtx.zip
          unzip -o mtx.zip mediamtx.exe
      - name: Compare with official FFmpeg
        run: tests/compare.sh dist/windows-x64/flock-media.exe "$(command -v ffmpeg)" ./mediamtx.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the release; this job only runs for version tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "Tag $GITHUB_REF_NAME doesn't match VERSION"; exit 1; }
          FFMPEG=$(grep -m1 '^FFMPEG_VERSION=' scripts/build.sh | cut -d'"' -f2)
          mkdir out
          for t in macos-arm64 macos-x64 windows-x64; do
            cp NOTICE.txt "dist/$t/"
            (cd "dist/$t" && chmod +x flock-media* && zip -q -r "../../out/flock-media-engine-$VERSION-$t.zip" .)
          done
          (cd out && sha256sum *.zip > SHA256SUMS.txt)
          for t in macos-arm64 macos-x64 windows-x64; do echo "$t: $(grep '^SHA-256' dist/$t/BUILDINFO.txt)"; done > binaries.txt
          {
            echo "Flock Media Engine $VERSION, built on FFmpeg $FFMPEG."
            echo
            echo "Each zip holds the engine, its build details (BUILDINFO.txt), LICENSE.txt and NOTICE.txt."
            echo "Built and tested against a full official FFmpeg on each platform by this workflow."
            echo
            echo "Engine checksums (SHA-256), as pinned by Flock Studio:"
            echo '```'; cat binaries.txt; echo '```'
          } > notes.md
          echo "FFMPEG=$FFMPEG" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Flock Media Engine ${GITHUB_REF_NAME#v} (FFmpeg $FFMPEG)" --notes-file notes.md --verify-tag
